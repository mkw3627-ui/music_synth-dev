input_schema = { type = "object", properties = { ddsp_root = { type = "string" }, ddsp_ckpt = { type = "string", description = "model_*.pt 路径；空=自动取最新" }, key_shift = { type = "integer", minimum = -24, maximum = 24 }, vocal_register_shift = { type = "integer", minimum = -12, maximum = 12 }, infer_step = { type = "integer", minimum = 5, maximum = 200, description = "RectifiedFlow 采样步数" }, preview_step = { type = "integer", minimum = 5, maximum = 400, description = "训练里程碑试听的推理步数" }, method = { type = "string", enum = ["euler", "rk4"] }, pitch_extractor = { type = "string", enum = ["rmvpe", "harvest", "parselmouth", "fcpe", "crepe", "dio"] }, f0_min = { type = "integer", minimum = 30, maximum = 300 }, f0_max = { type = "integer", minimum = 200, maximum = 1500 }, threshold = { type = "integer", minimum = -100, maximum = -10 }, auto_key = { type = "boolean" }, auto_key_max = { type = "integer", minimum = 0, maximum = 12 }, train_duration = { type = "number", minimum = 1, maximum = 10 }, train_amp = { type = "string", enum = ["fp16", "bf16", "fp32"] }, train_batch = { type = "integer", minimum = 0, maximum = 64 }, train_accum = { type = "integer", minimum = 1, maximum = 16 }, train_cache_fp16 = { type = "boolean" }, train_pitch_aug = { type = "boolean" }, vocal_reverb = { type = "number", minimum = 0, maximum = 0.6 }, reverb_auto = { type = "boolean" }, reverb_auto_strength = { type = "number", minimum = 0, maximum = 1 }, stereo_width = { type = "number", minimum = 1, maximum = 2 }, clarity = { type = "number", minimum = 0, maximum = 1.5 }, vocal_level_db = { type = "number", minimum = -12, maximum = 6 }, bgm_gain_db = { type = "number", minimum = -12, maximum = 12 }, consonant = { type = "number", minimum = 0, maximum = 0.8 }, device = { type = "string", enum = ["auto", "cuda", "cpu"] }, sep_backend = { type = "string", enum = ["bs_roformer", "demucs"] }, compute_root = { type = "string" }, envs_dir = { type = "string" }, models_dir = { type = "string" }, work_dir = { type = "string" }, sep_model_dir = { type = "string" }, base_python = { type = "string" }, precision = { type = "string", enum = ["auto", "fp32", "fp16", "bf16"] }, max_parallel = { type = "integer", minimum = 0, maximum = 4 }, download_source = { type = "string", enum = ["huggingface", "mirror"] }, ace_model = { type = "string", description = "ACE 原创生成用的 DiT 模型名" } } }

