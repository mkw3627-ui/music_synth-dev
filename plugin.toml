id = "ms_corpus_clip"
name = "为她而唱 · 语料切片操作"
description = "reject=剔除切片 / restore=恢复 / preview=返回 base64 试听"
input_schema = { type = "object", properties = { clip_id = { type = "string" }, action = { type = "string", enum = ["reject", "restore", "preview"] } }, required = ["clip_id", "action"] }

[[plugin.entries]]
id = "ms_corpus_remove"
name = "为她而唱 · 移除素材源"
description = "把某个 source_id 的原始音频/切片移入回收站并记录清单"
input_schema = { type = "object", properties = { source_id = { type = "string" } } }

[[plugin.entries]]
id = "ms_set_active_model"
name = "为她而唱 · 切换当前音色模型"
description = "把某个已训练好的 model_*.pt 设为当前变声模型（单独按钮，用户点才切换）"
input_schema = { type = "object", properties = { ckpt = { type = "string" } } }

[[plugin.entries]]
id = "ms_export_model"
name = "为她而唱 · 导出声音"
description = "把训练好的声音打包成 zip（模型 + config.yaml），方便备份、换机或分享"
input_schema = { type = "object", properties = { path = { type = "string" } }, required = ["path"] }

[[plugin.entries]]
id = "ms_open_export_dir"
name = "为她而唱 · 打开导出文件夹"
description = "在资源管理器里打开声音包的导出目录"
input_schema = { type = "object", properties = {  } }

[[plugin.entries]]
id = "ms_model_import_begin"
name = "为她而唱 · 开始导入声音"
description = "开一个声音包分片上传会话；只接受 .zip（内含 model_*.pt 和 config.yaml）"
input_schema = { type = "object", properties = { filename = { type = "string" } } }

[[plugin.entries]]
id = "ms_model_import_chunk"
name = "为她而唱 · 导入声音分片"
description = "追加一片声音包数据到上传会话"
input_schema = { type = "object", properties = { upload_id = { type = "string" }, seq = { type = "integer" }, data_b64 = { type = "string" } }, required = ["upload_id", "data_b64"] }

[[plugin.entries]]
id = "ms_model_import_end"
name = "为她而唱 · 结束导入声音"
description = "收尾上传并安装声音包；成功后出现在「我的声音」列表里"
input_schema = { type = "object", properties = { upload_id = { type = "string" } }, required = ["upload_id"] }

[[plugin.entries]]
id = "ms_ace_status"
name = "为她而唱 · 原创生成环境"
description = "只读：检查 ACE 环境、模型与代码是否就绪"
input_schema = { type = "object", properties = {  } }

[[plugin.entries]]
id = "ms_ace_download"
name = "为她而唱 · 下载 ACE 模型"
description = "下载指定的 ACE-Step DiT 模型到计算目录（后台；XL 约 18.6GB，可断点续传）"
input_schema = { type = "object", properties = { model = { type = "string", description = "例如 acestep-v15-xl-turbo" }, force = { type = "boolean", description = "配置不够时仍然安装" } } }

[[plugin.entries]]
id = "ms_ace_generate"
name = "为她而唱 · 原创歌曲"
description = "用 ACE-Step text2music 按风格描述+歌词生成整首歌；可选 auto_sing 直接走现有变声链路"
input_schema = { type = "object", properties = { prompt = { type = "string" }, lyrics = { type = "string" }, name = { type = "string" }, duration = { type = "integer" }, bpm = { type = "integer" }, language = { type = "string", enum = ["auto", "zh", "ja", "en", "ko", "unknown"] }, instrumental = { type = "boolean" }, auto_sing = { type = "boolean" }, post_sing = { type = "boolean", description = "兼容旧面板：等于 post_engine=ddsp" }, post_engine = { type = "string", enum = ["", "ddsp", "soulx", "soulx_ddsp"], description = "干声后处理引擎：空=不处理，ddsp=翻唱声音，soulx=SoulX-Singer SVC，soulx_ddsp=SoulX 后接 DDSP（保气音）" }, model = { type = "string", description = "DiT 模型名；留空=用设置里的当前模型（turbo 8 步，XL/sft/base 50 步）" }, inference_steps = { type = "integer", minimum = 0, maximum = 60, description = "0=按模型自动（turbo 8，sft/base 50）" }, guidance_scale = { type = "number" }, seed = { type = "integer" }, candidates = { type = "integer", minimum = 1, maximum = 6, description = "一次生成几个候选；小显存自动降到 1" }, quantization = { type = "string", enum = ["auto", "off", "int8_weight_only", "fp8_weight_only"], description = "量化策略：auto=按显存自动，off=不量化，int8=权重量化（显存减半）" }, lora = { type = "string" } } }

[[plugin.entries]]
id = "ms_ace_job"
name = "为她而唱 · 原创生成进度"
description = "查询一次原创生成任务的状态"
input_schema = { type = "object", properties = { job_id = { type = "string" } } }

[[plugin.entries]]
id = "ms_ace_install"
name = "为她而唱 · 安装 ACE 依赖"
description = "把 ACE 需要的 Python 依赖装到计算根目录的 acestep/pylibs（模型用 ms_ace_download 单独下载）"
input_schema = { type = "object", properties = {  } }

[[plugin.entries]]
id = "ms_ace_loras"
name = "为她而唱 · ACE 音色列表"
description = "列出已经训练好的 ACE 音色 LoRA"
input_schema = { type = "object", properties = {  } }

[[plugin.entries]]
id = "ms_ace_set_lora"
name = "为她而唱 · 设为当前原创音色"
description = "把某个原创歌曲音色设为默认；生成时按所选模型自动挑对应变体"
input_schema = { type = "object", properties = { name = { type = "string" } } }

[[plugin.entries]]
id = "ms_ace_delete_lora"
name = "为她而唱 · 删除原创音色"
description = "把某个原创歌曲音色的所有底模变体移进回收站"
input_schema = { type = "object", properties = { name = { type = "string" }, delete_files = { type = "boolean" } } }

[[plugin.entries]]
id = "ms_ace_export_lora"
name = "为她而唱 · 导出原创音色"
description = "把某个原创歌曲音色的所有底模变体打包成 zip，放到导出目录"
input_schema = { type = "object", properties = { name = { type = "string" } } }

[[plugin.entries]]
id = "ms_ace_preview"
name = "为她而唱 · 试听原创音色"
description = "用这个原创音色生成一段 10 秒试听（首次较慢，之后走缓存）"
input_schema = { type = "object", properties = { name = { type = "string" }, model = { type = "string" } } }

[[plugin.entries]]
id = "ms_soulx_status"
name = "为她而唱 · SoulX 环境"
description = "只读：检查 SoulX-Singer SVC 的代码、权重、音高模型和音色样本"
input_schema = { type = "object", properties = {  } }

[[plugin.entries]]
id = "ms_soulx_install"
name = "为她而唱 · 安装 SoulX-Singer"
description = "下载 SoulX-SVC 权重、RMVPE 与运行环境（后台；可断点续传）"
input_schema = { type = "object", properties = {  } }

[[plugin.entries]]
id = "ms_ace_train"
name = "为她而唱 · 训练 ACE 音色"
description = "用「准备素材」里已处理的切片训练 ACE-Step 音色 LoRA；可传入多个模型，依次排队训练"
input_schema = { type = "object", properties = { name = { type = "string" }, models = { type = "array", items = { type = "string" }, description = "要训练的底模列表；留空=所有已下载模型依次训练" }, epochs = { type = "integer", minimum = 1, maximum = 100 }, rank = { type = "integer", minimum = 4, maximum = 128 }, alpha = { type = "integer", minimum = 4, maximum = 256 }, batch = { type = "integer", minimum = 1, maximum = 8 }, gradient_accumulation = { type = "integer", minimum = 1, maximum = 32 }, max_duration = { type = "number" }, max_clips = { type = "integer", minimum = 0, maximum = 2000, description = "调试/快速试训：只用前 N 段素材；0=全部" } } }

[[plugin.entries]]
id = "ms_corpus_delete_sources"
name = "为她而唱 · 批量删除素材"
description = "按 source_ids 批量删除，或传 all=true + slot 清空某一类素材；都移到回收站"
input_schema = { type = "object", properties = { source_ids = { type = "array", items = { type = "string" } }, slot = { type = "string", enum = ["song", "dry_sing", "speech"] }, all = { type = "boolean" } } }
