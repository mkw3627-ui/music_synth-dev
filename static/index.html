<html lang="zh-CN" data-neko-html-shell="1">

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>为她而唱</title>
<!-- 为她而唱 · 单文件面板（2026-11-04）
     由 _html_shell/build.mjs 从 ui/ 原业务代码打出来；不要手改，改 ui/ 后重新构建。
     运行时：内建极简 React 等价件（neko-runtime-1），kit 等价件代替 @neko/plugin-ui，
     不引任何外链、不联网。宿主入口 ui/panel.tsx 只用 <iframe> 装这一页。 -->
<style data-shell>
  html, body { margin: 0; padding: 0; width: 100%; min-height: 100%; }
  body {
    font-family: 'Microsoft YaHei UI','Microsoft YaHei',PingFang SC,'Noto Sans SC',system-ui,sans-serif;
    color: #282532; background: #f8fafc;
    background-image:
      radial-gradient(1100px 520px at 8% -10%, rgba(224,45,118,0.10), transparent 60%),
      radial-gradient(900px 480px at 100% 0%, rgba(255,214,231,0.55), transparent 55%),
      radial-gradient(800px 600px at 50% 120%, rgba(214,232,255,0.45), transparent 60%);
    background-attachment: fixed;
    -webkit-font-smoothing: antialiased;
  }
  #root { padding: 8px 8px 34px; min-height: 100vh; }
  #root * { box-sizing: border-box; }
  /* 宿主等价件里，组件实例外面套的定位壳不该影响排版 */
  [data-neko-cell] { display: contents; }
  [data-kit], .neko-page { display: block; }
  #root button { font-family: inherit; }
  #root a { color: #e02d76; }
  #root img, #root audio, #root video { max-width: 100%; }
  #root ::-webkit-scrollbar { width: 8px; height: 8px; }
  #root ::-webkit-scrollbar-thumb { background: rgba(148,143,160,0.35); border-radius: 8px; }
</style>
